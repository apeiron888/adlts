services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio_data:/data"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      MINIO_ENDPOINT: minio:9000
      ESP32_STREAM_URL: http://192.168.1.10/stream   # fill in after device boots
    depends_on: [minio]

volumes:
  minio_data: